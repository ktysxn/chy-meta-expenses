name: Deploy expense dashboard to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify mobile dashboard
        run: |
          npm install --no-save playwright @supabase/supabase-js@2.110.2 esbuild@0.25.12 tesseract.js@7.0.0 @tesseract.js-data/eng@1.0.0
          npx esbuild sdk-entry.js --bundle --format=esm --platform=browser --outfile=supabase-sdk.js
          mkdir -p ocr
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js ocr/
          cp node_modules/tesseract.js-core/*.wasm* ocr/
          cp node_modules/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz ocr/
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 &
          node mobile-check.cjs
          node sync-check.cjs
          node meal-check.cjs
          node overview-check.cjs
      - name: Verify private access policies and atomic revisions
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/migrations/001_private_sync.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/access.sql
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package only public app shell
        run: |
          mkdir public
          cp index.html theme.css manifest.webmanifest sw.js sync.js planner.js command.js receipts.js meal-tools.js expense-editor.js overview-tools.js cloud-config.json supabase-sdk.js icon-192.png icon-512.png public/
          cp -r ocr public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
